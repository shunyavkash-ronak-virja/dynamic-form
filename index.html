<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Multi-Step Form</title>

    <!----- Nice select css ----->
    <link rel="stylesheet" href="assets/css/nice-select.css">

    <!----- Google Font ----->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Serif+Display:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!----- Custom Css ----->
    <link rel="stylesheet" href="assets/css/mian.css">
</head>

<body>

    <section class="main-wrapper">
        <!-- <div class="form-step-counter"></div> -->
        <form class="form-step-wrapper">
            <div class="form-step form-step-one active">
                <div class="form-title-wrapper">
                    <h2 class="form-title">Tell us about yourself</h2>
                    <p class="form-description">Enter your basic personal information to get started.</p>
                </div>
                <div class="form-step-field">
                    <div class="input-stack">
                        <label class="input-label" for="first-name">First Name</label>
                        <input class="input-field" type="text" name="first-name" id="first-name" placeholder="Enter your first name" required>
                    </div>
                    <div class="input-stack">
                        <label class="input-label" for="last-name">Last Name</label>
                        <input class="input-field" type="text" name="last-name" id="last-name" placeholder="Enter your last name" required>
                    </div>
                    <div class="input-stack">
                        <label class="input-label" for="email">Email</label>
                        <input class="input-field" type="email" name="email" id="email" placeholder="Enter your email address" required>
                    </div>
                    <div class="input-stack">
                        <label class="input-label" for="phone">Phone Number</label>
                        <input class="input-field" type="number" name="phone" id="phone" placeholder="Enter your phone number" minlength="10" maxlength="10" required>
                    </div>
                    <div class="input-stack">
                        <label class="input-label" for="date-of-birth">Date of Birth</label>
                        <input class="input-field" type="date" name="date-of-birth" id="date-of-birth" placeholder="Select your date of birth" required>
                    </div>
                    <div class="input-stack">
                        <label class="input-label cursor-auto" for="nationality">Nationality</label>
                        <select class="input-field" name="nationality" id="nationality" required>
                            <option value="" selected disabled>Select your nationality</option>
                            <option value="australia">Australia</option>
                            <option value="brazil">Brazil</option>
                            <option value="canada">Canada</option>
                            <option value="china">China</option>
                            <option value="egypt">Egypt</option>
                            <option value="germany">Germany</option>
                            <option value="india">India</option>
                            <option value="italy">Italy</option>
                            <option value="japan">Japan</option>
                            <option value="mexico">Mexico</option>
                            <option value="nigeria">Nigeria</option>
                            <option value="russia">Russia</option>
                            <option value="spain">Spain</option>
                            <option value="united-kingdom">United Kingdom</option>
                            <option value="united-states">United States</option>
                        </select>
                    </div>
                    <div class="column-span-2 input-stack">
                        <label class="input-label cursor-auto" for="gender">Gender</label>
                        <div class="gender-wrapper">
                            <label class="gender-stack" for="male">
                                <input class="primary-radio" type="radio" name="gender" id="male" checked>
                                Male
                            </label>
                            <label class="gender-stack" for="female">
                                <input class="primary-radio" type="radio" name="gender" id="female">
                                Female
                            </label>
                            <label class="gender-stack" for="other">
                                <input class="primary-radio" type="radio" name="gender" id="other">
                                Other
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-step form-step-two">
                <div class="form-title-wrapper">
                    <h2 class="form-title">Employment Details</h2>
                    <p class="form-description">Tell us about your current employment or education status.</p>
                </div>
                <div class="form-step-field">
                    <div class="input-stack">
                        <label class="input-label" for="first-name">What is your current status?</label>
                        <select class="input-field" name="nationality" id="nationality" required>
                            <option value="" selected disabled>Select your nationality</option>
                            <option value="australia">Australia</option>
                            <option value="brazil">Brazil</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-btn-wrapper">
                <button class="btn secondary-btn item-hidden" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon lucide lucide-move-left preview-icon">
                        <path d="M6 8L2 12L6 16" />
                        <path d="M2 12H22" />
                    </svg>
                    <span>Back</span>
                </button>
                <button class="btn primary-btn" type="submit">
                    <span>Continue</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon lucide lucide-move-right preview-icon">
                        <path d="M18 8L22 12L18 16" />
                        <path d="M2 12H22" />
                    </svg>
                </button>
            </div>
        </form>
    </section>

    <!-- Nice select js -->
    <script src="assets/js/jquery.js"></script>
    <script src="assets/js/jquery.nice-select.js"></script>

    <!----- Custom Js ----->
    <script src="assets/js/script.js"></script>
</body>

</html>
